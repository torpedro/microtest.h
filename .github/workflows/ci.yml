name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
            preset: dev
          - os: ubuntu-latest
            compiler: clang++
            preset: dev
          - os: ubuntu-latest
            compiler: g++
            preset: modern
          - os: ubuntu-latest
            compiler: clang++
            preset: sanitizers
          - os: macos-latest
            compiler: clang++
            preset: dev
          - os: windows-latest
            compiler: cl
            preset: dev
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.2
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install clang-format==18.1.8
      - run: find include tests examples -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
